[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecam-desktop"
version = "0.4.4"
description = "Use an Android camera or a network video stream as a Linux webcam"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7", "numpy>=1.26", "opencv-python>=4.8"]

[project.scripts]
phonecam = "phonecam.app:main"

[tool.setuptools.packages.find]
include = ["phonecam*"]

[tool.setuptools.package-data]
phonecam = ["assets/*.svg", "assets/*.tflite"]
